name: Update trending

on:
  schedule:
    - cron: "0 1 * * *" # 09:00 Taiwan time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch github.com/trending
        run: python server.py --dump trending.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trending.json
          git diff --cached --quiet || git commit -m "chore: update trending $(date -u +%F)"
          git push
